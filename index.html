/* =====================================================================
   Уровень
   ===================================================================== */
const OP_TEXT = { '+': '+', '−': '−', '×': '×', '÷': '÷', '=': '=' };

function prepPuzzle() {
  P.eqOf = P.cells.map(() => []);
  P.eqs.forEach((e, ei) => e.forEach((ci) => P.eqOf[ci].push(ei)));
  P.blanks = [];
  P.cells.forEach((c, i) => { if (c.b) P.blanks.push(i); });
}
function rebuildTileAt() {
  tileAt = P.bank.map(() => -1);
  run.board.forEach((t, ci) => { if (t >= 0) tileAt[t] = ci; });
}
const isLocked = (ci) => run.locked.includes(ci);
const isFull = () => P.blanks.every((ci) => run.board[ci] >= 0);

function startLevel() {
  hideOverlay('winOv');
  const lv = save.level;
  const isResume = !!(save.run && save.run.level === lv);
  if (save.run && save.run.level === lv) run = save.run;
  else {
    const pz = generate(lv);
    run = { level: lv, puzzle: pz, board: pz.cells.map(() => -1), locked: [], hints: 0, mistakes: 0, wasFull: false, time: 0 };
  }
  save.run = run;
  P = run.puzzle;
  // eqOf / blanks не сохраняются — пересчитываем
  Object.defineProperty(P, 'eqOf', { value: null, writable: true, enumerable: false, configurable: true });
  Object.defineProperty(P, 'blanks', { value: null, writable: true, enumerable: false, configurable: true });
  prepPuzzle();
  rebuildTileAt();
  clearSel();
  moveHistory = [];
  shownLeft = null;
  resetZoom();
  $('gLevel').textContent = t('level', { n: lv });
  buildBoard();
  buildBank();
  showScreen('game');
  state = 'playing';
  pushGameState();
  eqStates = P.eqs.map((_, i) => eqState(i));
  renderAll();
  fitBank();
  fitBoard();
  requestAnimationFrame(() => { fitBank(); fitBoard(); });
  persist();
  abandonSent = null; pauseSent = null;
  clockFrom = 0;
  renderClock();
  clockStart();
  analytics.hit('level_start', { level: lv, resumed: isResume ? 1 : 0 });
}

function eqState(ei) {
  const nums = [], ops = [];
  let rhs = null, afterEq = false;
  for (const ci of P.eqs[ei]) {
    const c = P.cells[ci];
    if (c.t === 'n') {
      let v = c.v;
      if (c.b) { const t = run.board[ci]; if (t < 0) return 'incomplete'; v = P.bank[t]; }
      if (afterEq) rhs = v; else nums.push(v);
    } else if (c.t === 'o') ops.push(c.v);
    else afterEq = true;
  }
  return evalLhs(nums, ops, false) === rhs ? 'ok' : 'bad';
}

function buildBoard() {
  const board = $('board');
  board.innerHTML = '';
  board.style.gridTemplateColumns = 'repeat(' + P.cols + ', var(--cell))';
  board.style.gridTemplateRows = 'repeat(' + P.rows + ', var(--cell))';
  cellEls = P.cells.map((c, i) => {
    const el = document.createElement('div');
    el.className = 'cell ' + (c.b ? 's' : c.t);
    el.style.gridRow = String(c.y + 1);
    el.style.gridColumn = String(c.x + 1);
    // волна идёт по диагонали от левого верхнего угла, но не дольше четверти секунды
    el.style.setProperty('--d', Math.min(240, (c.x + c.y) * 14) + 'ms');
    el.classList.add('in');
    if (c.b) { el.dataset.cell = String(i); el.setAttribute('role', 'gridcell'); }
    else {
      el.textContent = c.t === 'n' ? String(c.v) : OP_TEXT[c.v];
      if (c.t === 'n' && String(c.v).length > 2) el.classList.add('d3');
    }
    board.appendChild(el);
    return el;
  });
}
// В банке по отдельной плитке на каждое число: две двойки — две плитки.
// Ушедшая на поле плитка оставляет свой «домик», поэтому банк не скачет.
function buildBank() {
  const bank = $('bank');
  bank.innerHTML = '';
  tileEls = P.bank.map((v, i) => {
    const el = document.createElement('button');
    el.className = 'tile';
    el.dataset.tile = String(i);
    el.textContent = String(v);
    el.setAttribute('aria-label', t('numAria', { n: v }));
    el.style.setProperty('--d', Math.min(300, 140 + i * 14) + 'ms');
    el.classList.add('in');
    bank.appendChild(el);
    return el;
  });
}
function fitBank() {
  if (!tileEls.length) return;
  const bank = $('bank'), cs = getComputedStyle(bank);
  const W = bank.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  if (W <= 0) return;
  // берём минимальное число рядов, при котором плитки не мельчат
  const gap = 8;
  let size = CONFIG.bankTileMin;
  for (let rows = 1; rows <= CONFIG.bankMaxRows; rows++) {
    const perRow = Math.ceil(tileEls.length / rows);
    size = clamp(Math.floor((W + gap) / perRow) - gap, CONFIG.bankTileMin, CONFIG.bankTileMax);
    if (size >= CONFIG.bankTileComfort || rows === CONFIG.bankMaxRows) break;
  }
  bank.style.setProperty('--tile', size + 'px');
  // трёхзначные плитки шире квадрата, поэтому число рядов проверяем по факту
  const land = window.matchMedia('(orientation:landscape)').matches && window.innerHeight <= 560;
  const budget = window.innerHeight * (land ? CONFIG.bankHeightShareLand : CONFIG.bankHeightShare);
  while (size > CONFIG.bankTileMin && bank.offsetHeight > budget) {
    size -= 2;
    bank.style.setProperty('--tile', size + 'px');
  }
}

function renderCells() {
  const full = isFull();
  P.cells.forEach((c, i) => {
    const el = cellEls[i];
    el.classList.toggle('bad', false);   // ошибки поле не показывает — игрок ищет их сам
    if (!c.b) return;
    const tile = run.board[i];
    const txt = tile >= 0 ? String(P.bank[tile]) : '';
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('d3', txt.length > 2);
    el.classList.toggle('f', tile >= 0 && !isLocked(i));
    el.classList.toggle('lk', isLocked(i));
    el.classList.toggle('sel', sel.cell === i);
    el.setAttribute('aria-label', tile >= 0 ? t('cellFull', { n: txt }) : t('cellEmpty'));
  });
}
function renderBank() {
  tileEls.forEach((el, i) => {
    const away = tileAt[i] >= 0 || i === dragTile;
    el.classList.toggle('home', away);
    el.classList.toggle('sel', !away && sel.tile === i);
    el.tabIndex = away ? -1 : 0;
  });
}
let shownLeft = null;
function renderStatus() {
  const s = $('status'), lf = $('gLeft');
  s.classList.remove('bad', 'ok');
  const left = P.blanks.filter((ci) => run.board[ci] < 0).length;
  const solved = eqStates.filter((e) => e === 'ok').length;

  // шапка: сколько клеток осталось и какая доля примеров сошлась
  lf.textContent = left ? t('leftShort', { n: left }) : t('leftNone');
  if (shownLeft !== null && shownLeft !== left) restartAnim(lf, 'bump');
  shownLeft = left;
  $('gBar').style.transform = 'scaleX(' + (P.eqs.length ? solved / P.eqs.length : 0) + ')';

  // строка под полем — только подсказки по текущему действию
  if (state === 'won') { s.textContent = t('allOk'); s.classList.add('ok'); return; }
  if (left === 0) { s.textContent = t('hasErrors'); return; }
  if (sel.tile >= 0) { s.textContent = t('pickCell', { n: P.bank[sel.tile] }); return; }
  if (sel.cell >= 0) { s.textContent = t('pickNumber'); return; }
  s.textContent = '';
}
let shownCoins = null;
function renderHud() {
  const box = $('gCoins');
  if (shownCoins !== null && shownCoins !== save.coins) restartAnim($('gCoinsBox'), 'bump');
  shownCoins = save.coins;
  box.textContent = save.coins;
  $('hintCost').textContent = CONFIG.hintCost;
  $('hintBtn').classList.toggle('poor', save.coins < CONFIG.hintCost);
}
function renderAll() { renderCells(); renderBank(); renderStatus(); renderHud(); renderUndo(); }

function fitBoard() {
  if (!P) return;
  const st = $('stage'), w = st.clientWidth, h = st.clientHeight;
  if (!w || !h) return;
  const n = P.cols, m = P.rows;
  // клетка считается от ширины экрана: поле занимает её целиком, если хватает высоты
  let cell;
  const gap = 1, pad = 4;       // клетки встык: между ними только линия в 1 px
  cell = Math.floor(Math.min(CONFIG.maxCellPx,
    (w - 2 * pad - gap * (n + 1)) / n,
    (h - 2 * pad - gap * (m + 1)) / m));
  const wrap = $('boardWrap').style;
  wrap.setProperty('--cell', Math.max(12, cell) + 'px');
  wrap.setProperty('--gap', gap + 'px');
  wrap.setProperty('--pad', pad + 'px');
}
function checkShort() {
  document.body.classList.toggle('h-short', window.innerHeight < CONFIG.shortScreenPx);
}

/* =====================================================================
   Ходы
   ===================================================================== */
function clearSel() { sel.tile = -1; sel.cell = -1; typed = ''; clearTimeout(typedTimer); }

/* =====================================================================
   Секундомер уровня. Идёт только на игровом экране, пока игра на виду:
   в меню, на экране победы и в свёрнутой игре стоит. Накопленное время
   хранится в run.time и сохраняется вместе с уровнем.
   ===================================================================== */
let clockFrom = 0, clockTimer = 0;
const clockRunning = () => clockFrom > 0;
function elapsedMs() { return (run ? run.time || 0 : 0) + (clockRunning() ? performance.now() - clockFrom : 0); }
function parSec() { return CONFIG.parBaseSec + CONFIG.parPerBlankSec * P.blanks.length; }
function fastBonus() { return Math.round(levelParams(run.level).T.reward * CONFIG.fastBonusShare); }
function fmtTime(ms) {
  const total = Math.floor(ms / 1000), h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), sec = total % 60;
  const ss = String(sec).padStart(2, '0');
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + ss : m + ':' + ss;
}
function renderClock() {
  if (!run || !P) return;
  const ms = elapsedMs();
  $('gTime').textContent = fmtTime(ms);
  const b = $('gBonus'), inTime = ms / 1000 <= parSec();
  b.textContent = '+' + fastBonus();
  b.classList.toggle('gone', !inTime);
}
function clockTick() {
  clearTimeout(clockTimer);
  if (!clockRunning()) return;
  renderClock();
  // следующий тик — ровно к смене секунды, без дрейфа
  clockTimer = setTimeout(clockTick, 1000 - (elapsedMs() % 1000) + 5);
}
function clockStart() {
  if (clockRunning() || state !== 'playing' || document.hidden || !run) return;
  clockFrom = performance.now();
  clockTick();
}
function clockStop() {
  if (!clockRunning()) return;
  run.time = Math.max(0, Math.round(elapsedMs()));
  clockFrom = 0;
  clearTimeout(clockTimer);
  renderClock();
}

/* Отмена хода: снимок расстановки перед каждым изменением. Клетки от подсказки
   не откатываем — монеты уже потрачены, иначе подсказку можно было бы отменять. */
function snapshot() {
  moveHistory.push(run.board.slice());
  if (moveHistory.length > CONFIG.undoDepth) moveHistory.shift();
}
function undo() {
  if (state !== 'playing' || !moveHistory.length) return;
  const prev = moveHistory.pop();
  const used = new Set();
  run.locked.forEach((ci) => { prev[ci] = run.board[ci]; used.add(run.board[ci]); });
  prev.forEach((tl, ci) => {
    if (tl < 0 || run.locked.includes(ci)) return;
    if (used.has(tl)) prev[ci] = -1; else used.add(tl);
  });
  run.board = prev;
  rebuildTileAt();
  clearSel();
  audio.play('back');
  eqStates = P.eqs.map((_, i) => eqState(i));
  run.wasFull = isFull();
  renderAll();
  persist();
}
function renderUndo() { $('undoBtn').disabled = state !== 'playing' || !moveHistory.length; }

// Поставить плитку t в клетку ci. Если клетка занята — её число меняется местами
// с источником (другая клетка) или уходит в банк.
function placeTile(t, ci) {
  if (!P.cells[ci] || !P.cells[ci].b || isLocked(ci)) { audio.play('deny'); restartAnim(cellEls[ci], 'shake'); return false; }
  const from = tileAt[t];
  if (from === ci) return false;
  snapshot();
  const occ = run.board[ci];
  if (occ >= 0) {
    if (from >= 0) { run.board[from] = occ; tileAt[occ] = from; }
    else tileAt[occ] = -1;
  } else if (from >= 0) run.board[from] = -1;
  run.board[ci] = t; tileAt[t] = ci;
  clearSel();
  audio.play('place'); vibrate(8);
  afterMove([ci, occ >= 0 && from >= 0 ? from : -1]);
  return true;
}
function returnToBank(ci) {
  const t = run.board[ci];
  if (t < 0 || isLocked(ci)) return false;
  snapshot();
  run.board[ci] = -1; tileAt[t] = -1;
  clearSel();
  audio.play('back');
  afterMove([]);
  restartAnim(tileEls[t], 'pop');
  return true;
}

function afterMove(changed) {
  const prev = eqStates;
  eqStates = P.eqs.map((_, i) => eqState(i));
  const full = isFull(), allOk = eqStates.every((s) => s === 'ok');
  if (full && allOk) { renderAll(); win(); return; }
  renderAll();
  changed.forEach((ci) => { if (ci >= 0) restartAnim(cellEls[ci], 'pop'); });
  if (full) {
    if (!run.wasFull) run.mistakes++;
    run.wasFull = true;
    audio.play('bad'); vibrate([30, 40, 30]);
  } else {
    run.wasFull = false;
    if (eqStates.some((s, ei) => s === 'ok' && prev[ei] !== 'ok')) audio.play('ok');
  }
  persist();
}

function useHint() {
  if (state !== 'playing') return;
  if (save.coins < CONFIG.hintCost) {
    audio.play('deny');
    restartAnim($('gCoinsBox'), 'shake');
    toast(t('hintPoor', { n: CONFIG.hintCost }));
    return;
  }
  // первая по порядку клетка, где сейчас не то число, что в решении
  const ci = P.blanks.find((i) => !isLocked(i) && (run.board[i] < 0 || P.bank[run.board[i]] !== P.cells[i].v));
  if (ci === undefined) return;
  const need = P.cells[ci].v;
  // откуда взять нужное число: из банка, иначе с клетки, где оно стоит не на своём месте
  let tile = P.bank.findIndex((v, i) => v === need && tileAt[i] < 0);
  let src = -1;
  if (tile < 0) {
    src = P.blanks.find((i) => i !== ci && !isLocked(i) && run.board[i] >= 0 && P.bank[run.board[i]] === need && P.cells[i].v !== need);
    if (src === undefined) src = P.blanks.find((i) => i !== ci && !isLocked(i) && run.board[i] >= 0 && P.bank[run.board[i]] === need);
    if (src === undefined) return;          // не бывает: число из решения всегда есть в наборе
    tile = run.board[src];
  }
  snapshot();
  if (run.board[ci] >= 0) { tileAt[run.board[ci]] = -1; run.board[ci] = -1; }
  if (src >= 0) run.board[src] = -1;
  run.board[ci] = tile; tileAt[tile] = ci;
  run.locked.push(ci);
  run.hints++;
  save.coins -= CONFIG.hintCost;
  clearSel();
  audio.play('hint');
  vibrate(12);
  afterMove([ci]);
  restartAnim(cellEls[ci], 'flash');
  analytics.hit('hint_used', { level: run.level });
}

function resetBoard() {
  if (state !== 'playing') return;
  let moved = false;
  if (P.blanks.some((ci) => run.board[ci] >= 0 && !isLocked(ci))) snapshot();
  P.blanks.forEach((ci) => {
    const t = run.board[ci];
    if (t >= 0 && !isLocked(ci)) { run.board[ci] = -1; tileAt[t] = -1; moved = true; }
  });
  clearSel();
  if (!moved) { audio.play('deny'); return; }
  audio.play('back');
  afterMove([]);
}

function win() {
  clockStop();
  state = 'won';
  clearSel();
  renderAll();
  const stars = clamp(3 - run.hints - (run.mistakes > 0 ? 1 : 0), 1, 3);
  const sec = Math.round((run.time || 0) / 1000);
  const bonus = sec <= parSec() ? fastBonus() : 0;
  const reward = Math.round(levelParams(run.level).T.reward * CONFIG.starCoins[stars]) + bonus;
  analytics.hit('level_complete', { level: run.level, stars, hints: run.hints, mistakes: run.mistakes, reward, sec, fast: bonus ? 1 : 0 });
  save.coins += reward;
  save.stars += stars;
  save.level = run.level + 1;
  save.run = null;
  persist(true);
  renderHud();
  cellEls.forEach((el) => restartAnim(el, 'flash'));
  audio.play('win'); vibrate([20, 60, 20]);
  FX.burst();
  const svgs = $('winStars').querySelectorAll('svg');
  svgs.forEach((s, i) => s.classList.toggle('on', i < stars));
  $('winReward').textContent = '+' + reward;
  $('winTime').innerHTML = t('winTime', { t: fmtTime(run.time || 0) }) + (bonus ? ' · <b>' + t('winFast', { n: bonus }) + '</b>' : '');
  $('winNote').textContent = stars === 3 ? t('winClean') : t('winNote', { h: run.hints, m: run.mistakes });
  setTimeout(() => { if (state === 'won') { showOverlay('winOv'); $('nextBtn').focus({ preventScroll: true }); } }, 700);
}

/* =====================================================================
   Масштаб поля: щипок двумя пальцами. Один палец всегда остаётся за игрой,
   поэтому зум и перетаскивание чисел не спорят друг с другом.
   ===================================================================== */
const zoom = { scale: 1, x: 0, y: 0 };
function applyZoom() {
  $('boardWrap').style.transform =
    'translate(' + zoom.x + 'px,' + zoom.y + 'px) scale(' + zoom.scale + ')';
}
function clampPan() {
  const st = $('stage').getBoundingClientRect(), w = $('boardWrap');
  const mx = Math.max(0, (w.offsetWidth * zoom.scale - st.width) / 2);
  const my = Math.max(0, (w.offsetHeight * zoom.scale - st.height) / 2);
  zoom.x = clamp(zoom.x, -mx, mx);
  zoom.y = clamp(zoom.y, -my, my);
}
function resetZoom() { zoom.scale = 1; zoom.x = 0; zoom.y = 0; applyZoom(); }

const pointers = new Map();
let pinch = null;
const midOf = () => {
  const [a, b] = [...pointers.values()];
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) };
};
function startPinch() {
  if (press) { if (press.active) endDrag(); press = null; renderAll(); }
  const st = $('stage').getBoundingClientRect();
  const m = midOf();
  pinch = {
    d0: m.d || 1, s0: zoom.scale,
    cx: st.left + st.width / 2, cy: st.top + st.height / 2,
    lx: (m.x - (st.left + st.width / 2) - zoom.x) / zoom.scale,
    ly: (m.y - (st.top + st.height / 2) - zoom.y) / zoom.scale,
  };
}
function movePinch() {
  const m = midOf();
  zoom.scale = clamp(pinch.s0 * (m.d / pinch.d0), CONFIG.zoomMin, CONFIG.zoomMax);
  zoom.x = m.x - pinch.cx - zoom.scale * pinch.lx;
  zoom.y = m.y - pinch.cy - zoom.scale * pinch.ly;
  clampPan();
  applyZoom();
}

/* =====================================================================
   Ввод: тап и drag & drop через Pointer Events (мышь, тач, стилус)
   ===================================================================== */
let press = null;
const ghost = $('ghost');

function tileFromEvent(e) {
  const el = e.target.closest('[data-tile]');
  if (!el) return -1;
  const i = Number(el.dataset.tile);
  return tileAt[i] < 0 ? i : -1;
}
function cellSize() { return (parseFloat(getComputedStyle($('boardWrap')).getPropertyValue('--cell')) || 30) * zoom.scale; }
// клетки мелкие — промах мимо клетки засчитываем за ближайшую пустую
function nearestBlank(x, y) {
  let best = -1, bd = cellSize() * CONFIG.tapSnap;
  P.blanks.forEach((ci) => {
    const r = cellEls[ci].getBoundingClientRect();
    const d = Math.hypot(r.left + r.width / 2 - x, r.top + r.height / 2 - y);
    if (d < bd) { bd = d; best = ci; }
  });
  return best;
}
function cellFromEvent(e) {
  const el = e.target.closest('[data-cell]');
  return el ? Number(el.dataset.cell) : -1;
}
function onDown(e) {
  if (state !== 'playing' || overlayOpen() || (e.pointerType === 'mouse' && e.button !== 0)) return;
  if (pinch) return;
  if (press) return;
  audio.resume();
  const t = tileFromEvent(e);
  let ci = t < 0 ? cellFromEvent(e) : -1;
  if (t < 0 && ci < 0 && e.target.closest('#board')) ci = nearestBlank(e.clientX, e.clientY);
  if (t < 0 && ci < 0) return;
  let drag = -1, from = -1;
  if (t >= 0 && tileAt[t] < 0) { drag = t; from = -1; }
  else if (ci >= 0 && run.board[ci] >= 0 && !isLocked(ci)) { drag = run.board[ci]; from = ci; }
  press = { pid: e.pointerId, x0: e.clientX, y0: e.clientY, t, ci, drag, from, active: false,
            lift: e.pointerType === 'mouse' ? 0 : CONFIG.touchLiftPx, targets: null, over: null };
  e.preventDefault();
}
function beginDrag() {
  press.active = true;
  audio.play('pick');
  ghost.textContent = String(P.bank[press.drag]);
  ghost.hidden = false;
  restartAnim(ghost, 'up');
  if (press.from >= 0) cellEls[press.from].classList.add('lift');
  else dragTile = press.drag;
  // центры клеток кэшируем на время перетаскивания
  press.cs = cellSize();
  press.targets = P.blanks.filter((ci) => !isLocked(ci)).map((ci) => {
    const r = cellEls[ci].getBoundingClientRect();
    return { ci, x: r.left + r.width / 2, y: r.top + r.height / 2 };
  });
  press.bankRect = $('bank').getBoundingClientRect();
  clearSel();
  renderCells(); renderBank(); renderStatus();
}
function dropPoint(p, x, y) { return { x, y: y - p.lift }; }
function findTarget(p, x, y) {
  const b = p.bankRect;
  if (x >= b.left && x <= b.right && y >= b.top && y <= b.bottom) return 'bank';
  let best = null, bd = p.cs * CONFIG.dropRadius;
  for (const t of p.targets) {
    const d = Math.hypot(t.x - x, t.y - y);
    if (d < bd) { bd = d; best = t.ci; }
  }
  return best;
}
function onMove(e) {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch) { e.preventDefault(); movePinch(); return; }
  if (!press || e.pointerId !== press.pid) return;
  if (!press.active) {
    if (press.drag < 0) return;
    if (Math.hypot(e.clientX - press.x0, e.clientY - press.y0) < CONFIG.dragThresholdPx) return;
    beginDrag();
  }
  e.preventDefault();
  const p = dropPoint(press, e.clientX, e.clientY);
  const gw = ghost.offsetWidth, gh = ghost.offsetHeight;
  ghost.style.transform = 'translate3d(' + (p.x - gw / 2) + 'px,' + (p.y - gh / 2) + 'px,0) scale(1.06)';
  const over = findTarget(press, p.x, p.y);
  if (over !== press.over) {
    if (typeof press.over === 'number') cellEls[press.over].classList.remove('tgt');
    if (typeof over === 'number') cellEls[over].classList.add('tgt');
    press.over = over;
  }
}
function endDrag() {
  ghost.hidden = true;
  dragTile = -1;
  if (typeof press.over === 'number') cellEls[press.over].classList.remove('tgt');
  if (press.from >= 0) cellEls[press.from].classList.remove('lift');
}
function onUp(e) {
  if (!press || e.pointerId !== press.pid) return;
  const p = press;
  if (p.active) {
    endDrag();
    press = null;
    const pt = dropPoint(p, e.clientX, e.clientY);
    const target = findTarget(p, pt.x, pt.y);
    if (typeof target === 'number') placeTile(p.drag, target);
    else if (p.from >= 0) returnToBank(p.from);
    else { renderAll(); }
    return;
  }
  press = null;
  if (p.t >= 0) tapTile(p.t);
  else if (p.ci >= 0) tapCell(p.ci);
}
function onCancel(e) {
  if (!press || e.pointerId !== press.pid) return;
  if (press.active) endDrag();
  press = null;
  renderAll();
}

function tapTile(t) {
  if (tileAt[t] >= 0) return;
  if (sel.cell >= 0) { placeTile(t, sel.cell); return; }
  sel.tile = sel.tile === t ? -1 : t;
  if (sel.tile >= 0) audio.play('pick');
  renderAll();
}
function tapCell(ci) {
  if (isLocked(ci)) { audio.play('deny'); restartAnim(cellEls[ci], 'shake'); return; }
  if (sel.tile >= 0) { placeTile(sel.tile, ci); return; }
  if (run.board[ci] >= 0) { returnToBank(ci); return; }
  sel.cell = sel.cell === ci ? -1 : ci;
  if (sel.cell >= 0) audio.play('pick');
  renderAll();
}

/* ---------- Клавиатура: стрелки — клетка, цифры — число, Backspace — убрать ---------- */
function firstEmpty(after) {
  const list = P.blanks.filter((ci) => !isLocked(ci));
  const start = after >= 0 ? list.indexOf(after) + 1 : 0;
  for (let k = 0; k < list.length; k++) {
    const ci = list[(start + k) % list.length];
    if (run.board[ci] < 0) return ci;
  }
  return -1;
}
function moveSel(dx, dy) {
  const list = P.blanks;
  if (!list.length) return;
  if (sel.cell < 0) { sel.cell = firstEmpty(-1) >= 0 ? firstEmpty(-1) : list[0]; sel.tile = -1; renderAll(); return; }
  const c = P.cells[sel.cell];
  let best = -1, bs = Infinity;
  list.forEach((ci) => {
    if (ci === sel.cell) return;
    const o = P.cells[ci], ddx = o.x - c.x, ddy = o.y - c.y;
    const along = dx ? ddx * dx : ddy * dy, across = Math.abs(dx ? ddy : ddx);
    if (along <= 0) return;
    const score = along + across * 2;
    if (score < bs) { bs = score; best = ci; }
  });
  if (best >= 0) { sel.cell = best; sel.tile = -1; renderAll(); }
}
function commitTyped(t) {
  typed = '';
  clearTimeout(typedTimer);
  const ci = sel.cell;
  if (ci < 0) return;
  if (placeTile(t, ci) && state === 'playing') {
    const next = firstEmpty(ci);
    sel.cell = next;
    renderAll();
  }
}
function typeDigit(d) {
  if (sel.cell < 0) { sel.cell = firstEmpty(-1); renderAll(); if (sel.cell < 0) return; }
  if (isLocked(sel.cell)) { audio.play('deny'); return; }
  typed += d;
  clearTimeout(typedTimer);
  const free = [];
  tileAt.forEach((at, t) => { if (at < 0) free.push(t); });
  const exact = free.find((t) => String(P.bank[t]) === typed);
  const longer = free.some((t) => { const s = String(P.bank[t]); return s.length > typed.length && s.startsWith(typed); });
  if (exact !== undefined && !longer) commitTyped(exact);
  else if (exact !== undefined) typedTimer = setTimeout(() => commitTyped(exact), CONFIG.keyComboMs);
  else if (longer) typedTimer = setTimeout(() => { typed = ''; }, CONFIG.keyComboMs);
  else { typed = ''; audio.play('deny'); }
}
document.addEventListener('keydown', (e) => {
  const ov = overlayOpen();
  if (ov) {
    if (e.key !== 'Escape') return;
    if (ov.id === 'rulesOv') closeRules();
    else if (ov.id === 'menuOv') hideOverlay('menuOv');
    return;
  }
  if (state !== 'playing') return;
  audio.resume();
  const k = e.key;
  if (k === 'ArrowLeft') { e.preventDefault(); moveSel(-1, 0); }
  else if (k === 'ArrowRight') { e.preventDefault(); moveSel(1, 0); }
  else if (k === 'ArrowUp') { e.preventDefault(); moveSel(0, -1); }
  else if (k === 'ArrowDown') { e.preventDefault(); moveSel(0, 1); }
  else if (/^[0-9]$/.test(k)) { e.preventDefault(); typeDigit(k); }
  else if (k === 'Backspace' || k === 'Delete') {
    e.preventDefault();
    if (sel.cell >= 0 && run.board[sel.cell] >= 0) { const ci = sel.cell; returnToBank(ci); sel.cell = ci; renderAll(); }
  }
  else if (k === 'Escape') { if (sel.cell >= 0 || sel.tile >= 0) { clearSel(); renderAll(); } else goMenu(); }
  else if (k === 'h' || k === 'H' || k === 'р' || k === 'Р') useHint();
  else if (k === 'z' || k === 'Z' || k === 'я' || k === 'Я') { e.preventDefault(); undo(); }
});

/* =====================================================================
   Кнопки
   ===================================================================== */
function renderBurger() {
  $('soundVal').textContent = save.sound ? t('on') : t('off');
  $('langVal').textContent = save.lang === 'ru' ? 'RU' : 'EN';
  $('exitItem').hidden = !gemBridge.available;
}
function openBurger() {
  if (state === 'boot') return;
  renderBurger();
  showOverlay('menuOv');
  $('menuClose').focus({ preventScroll: true });
}
function openRules() {
  showOverlay('rulesOv');
  $('rulesOk').focus({ preventScroll: true });
  if (state !== 'boot') analytics.hit('rules_opened', { level: save.level });
}
function closeRules() {
  hideOverlay('rulesOv');
  if (!save.seenRules) { save.seenRules = true; persist(); }
}

/* Кнопки отвечают на касание, а не только на click: на Android после свайпа или
   при активном другом касании click иногда не приходит, и кнопка «умирает».
   Мышь и клавиатура по-прежнему идут через click. */
// Отметка последнего касания общая для всех кнопок: браузер присылает click уже
// после того, как интерфейс сменился, и он может попасть в элемент, появившийся
// под пальцем — например в только что открытый диалог, который тут же закроется.
let lastTouchTap = 0;
function onTap(id, fn) {
  const el = $(id);
  let armed = false;
  el.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') armed = true; });
  el.addEventListener('pointercancel', () => { armed = false; });
  el.addEventListener('pointerleave', () => { armed = false; });
  el.addEventListener('pointerup', (e) => {
    if (e.pointerType === 'mouse' || !armed) return;
    armed = false;
    lastTouchTap = Date.now();
    if (el.disabled) return;
    fn(e);
  });
  el.addEventListener('click', (e) => {
    if (Date.now() - lastTouchTap < 700) return;   // касание уже обработано
    fn(e);
  });
}
onTap('playBtn', () => { audio.resume(); startLevel(); });
onTap('rulesBtn', () => { audio.resume(); openRules(); });
onTap('rulesOk', closeRules);
onTap('burgerBtn', () => { audio.resume(); openBurger(); });
onTap('menuClose', () => hideOverlay('menuOv'));
onTap('menuOv', (e) => { if (e.target.id === 'menuOv') hideOverlay('menuOv'); });
onTap('soundItem', () => { toggleSound(); renderBurger(); });
onTap('langItem', () => { toggleLang(); renderBurger(); });
onTap('exitItem', () => { persist(true); gemBridge.close(); });
onTap('soundBtn', toggleSound);
onTap('backBtn', goMenu);
onTap('hintBtn', () => { audio.resume(); useHint(); });
onTap('resetBtn', resetBoard);
onTap('undoBtn', () => { audio.resume(); undo(); });
onTap('nextBtn', () => { audio.resume(); startLevel(); });
onTap('winMenuBtn', goMenu);
onTap('rulesOv', (e) => { if (e.target.id === 'rulesOv') closeRules(); });

// Пальцы считаем на всей сцене поля: два касания — масштаб, одно — игра.
let lastTap = { t: 0, x: 0, y: 0 };
$('stage').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse') return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) startPinch();
  // двойное касание возвращает поле к обычному масштабу
  const now = performance.now();
  const onEmpty = !e.target.closest('[data-cell]') && !e.target.closest('.cell');
  if (pointers.size === 1 && onEmpty && now - lastTap.t < 320 && zoom.scale > 1.02 &&
      Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
    resetZoom();
    if (press) { if (press.active) endDrag(); press = null; renderAll(); }
    lastTap = { t: 0, x: 0, y: 0 };
    return;
  }
  lastTap = onEmpty ? { t: now, x: e.clientX, y: e.clientY } : { t: 0, x: 0, y: 0 };
});
const dropPointer = (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
};
window.addEventListener('pointerup', dropPointer);
window.addEventListener('pointercancel', dropPointer);
// колесо с Ctrl и трекпад-щипок на десктопе
$('stage').addEventListener('dblclick', () => { if (zoom.scale > 1.02) resetZoom(); });
$('stage').addEventListener('wheel', (e) => {
  if (!e.ctrlKey || state !== 'playing') return;
  e.preventDefault();
  zoom.scale = clamp(zoom.scale * (1 - e.deltaY / 300), CONFIG.zoomMin, CONFIG.zoomMax);
  clampPan();
  applyZoom();
}, { passive: false });

['board', 'bank'].forEach((id) => {
  const el = $(id);
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
});
// клик по кнопке-плитке с клавиатуры (Enter/Space) — pointerdown его не ловит
$('bank').addEventListener('click', (e) => {
  if (e.detail !== 0) return;          // мышь и тач уже обработаны в pointerup
  const t = tileFromEvent(e);
  if (t >= 0 && state === 'playing') tapTile(t);
});
window.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onCancel);

window.addEventListener('resize', () => { checkShort(); fitBank(); fitBoard(); clampPan(); applyZoom(); });
if (window.ResizeObserver) new ResizeObserver(() => fitBoard()).observe($('stage'));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    persist(true);
    DEMO.stop();
    // свернул или закрыл игру посреди уровня
    reportPause();
    clockStop();
  } else if (state === 'menu' || state === 'boot') DEMO.start();   // не крутим анимацию в фоне
  else if (state === 'playing') clockStart();
});
// закрытие вкладки или вебвью: последний ход не должен потеряться в отложенном сохранении
window.addEventListener('pagehide', () => { clockStop(); persist(true); });

/* =====================================================================
   Превью на начальном экране: кроссворд решает сам себя по кругу.
   Крестом лежат два примера, одна клетка пустая — в неё влетает плитка.
   ===================================================================== */
const DEMO = (() => {
  /* Два примера по пять клеток, пересечение на общем числе. hi и vi — индексы
     общей клетки в горизонтальном и вертикальном примере: от них зависит форма
     фигуры. hi=2,vi=0 даёт «Т», hi=4,vi=4 — уголок, hi=2,vi=2 — крест и т.д.
     Порядок фигур при каждом запуске свой, пустая клетка тоже выбирается случайно. */
  const SAMPLES = [
    { h: [7, '+', 5, '=', 12],   v: [5, '×', 3, '=', 15],  hi: 2, vi: 0 },
    { h: [9, '−', 3, '=', 6],    v: [2, '+', 4, '=', 6],   hi: 4, vi: 4 },
    { h: [12, '−', 5, '=', 7],   v: [12, '÷', 4, '=', 3],  hi: 0, vi: 0 },
    { h: [12, '−', 5, '=', 7],   v: [8, '+', 4, '=', 12],  hi: 0, vi: 4 },
    { h: [7, '+', 5, '=', 12],   v: [20, '−', 5, '=', 15], hi: 2, vi: 2 },
    { h: [7, '+', 5, '=', 12],   v: [2, '+', 3, '=', 5],   hi: 2, vi: 4 },
    { h: [8, '+', 7, '=', 15],   v: [15, '÷', 3, '=', 5],  hi: 4, vi: 0 },
    { h: [18, '÷', 3, '=', 6],   v: [6, '×', 4, '=', 24],  hi: 4, vi: 0 },
    { h: [4, '×', 3, '=', 12],   v: [36, '÷', 3, '=', 12], hi: 4, vi: 4 },
    { h: [20, '−', 8, '=', 12],  v: [8, '÷', 2, '=', 4],   hi: 2, vi: 0 },
    { h: [6, '×', 3, '=', 18],   v: [9, '−', 3, '=', 6],   hi: 0, vi: 4 },
    { h: [14, '−', 9, '=', 5],   v: [5, '+', 7, '=', 12],  hi: 4, vi: 0 },
  ];
  const grid = $('demoGrid');
  let cells = [], timers = [], order = [], i = -1, running = false;
  const reduce = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const after = (ms, fn) => timers.push(setTimeout(fn, ms));
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const rnd = (n) => Math.floor(Math.random() * n);
  function reshuffle() {
    order = SAMPLES.map((_, k) => k);
    for (let k = order.length - 1; k > 0; k--) { const j = rnd(k + 1); const t = order[k]; order[k] = order[j]; order[j] = t; }
  }

  // Строит фигуру и возвращает клетки-числа, любую из которых можно спрятать
  function build(sample) {
    const type = (v) => (typeof v === 'number' ? 'n' : v === '=' ? 'e' : 'o');
    // координаты в условной системе: горизонталь по y=0, вертикаль по x=0
    const spots = [];
    sample.h.forEach((v, k) => spots.push({ v, x: k - sample.hi, y: 0 }));
    sample.v.forEach((v, k) => { if (k !== sample.vi) spots.push({ v, x: 0, y: k - sample.vi }); });
    const minX = Math.min(...spots.map((p) => p.x)), minY = Math.min(...spots.map((p) => p.y));
    const maxX = Math.max(...spots.map((p) => p.x)), maxY = Math.max(...spots.map((p) => p.y));
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(' + (maxX - minX + 1) + ', var(--dcell))';
    grid.style.gridTemplateRows = 'repeat(' + (maxY - minY + 1) + ', var(--dcell))';
    cells = [];
    const numbers = [];
    spots.forEach((p) => {
      const el = document.createElement('div');
      const txt = String(p.v);
      el.className = 'cell ' + type(p.v) + (txt.length > 2 ? ' d3' : '');
      el.style.gridColumn = String(p.x - minX + 1);
      el.style.gridRow = String(p.y - minY + 1);
      el.textContent = txt;
      el.dataset.v = txt;
      grid.appendChild(el);
      cells.push(el);
      if (type(p.v) === 'n') numbers.push(el);
    });
    return numbers;
  }

  function cycle() {
    if (!running) return;
    clear();
    i++;
    if (i >= order.length) { reshuffle(); i = 0; }
    const numbers = build(SAMPLES[order[i]]);
    const blank = numbers[rnd(numbers.length)];
    const value = blank.dataset.v;
    blank.textContent = '';
    blank.className = 'cell s';

    const fill = () => {
      blank.classList.remove('pick');
      blank.textContent = value;
      blank.className = 'cell s f' + (value.length > 2 ? ' d3' : '');
      restartAnim(blank, 'pop');
    };
    if (reduce()) { fill(); after(2600, cycle); return; }

    after(650, () => blank.classList.add('pick'));   // «выбрали клетку»
    after(1150, fill);                               // «поставили число»
    after(1450, () => cells.forEach((el, k) => after(k * 45, () => restartAnim(el, 'flash'))));
    after(3000, () => cells.forEach((el) => el.classList.add('gone')));
    after(3600, cycle);
  }

  return {
    start() { if (running) return; running = true; reshuffle(); i = -1; cycle(); },
    stop() { running = false; clear(); },
  };
})();

/* =====================================================================
   Яндекс.Метрика: только обезличенные события самой игры — какие уровни
   проходят, где бросают, берут ли подсказку. Никаких данных профиля
   Gem Space. Сам счётчик подключён в <head>; здесь только отправка целей.
   Если скрипт Метрики заблокирован или не загрузился, ym — просто очередь
   в памяти: игра ничего не замечает, а сигнал gemBridge.ready() уходит
   платформе независимо от аналитики.
   Каждая цель должна быть заведена в интерфейсе Метрики как «JavaScript-
   событие» с тем же идентификатором — иначе в отчётах её не будет.
   ===================================================================== */
const analytics = (() => {
  const ID = 113310085;
  function hit(name, params) {
    try { if (typeof window.ym === 'function') window.ym(ID, 'reachGoal', name, params || {}); } catch (e) { /* не критично */ }
  }
  return { hit };
})();

/* =====================================================================
   Запуск
   ===================================================================== */
async function boot() {
  checkShort();
  applyLang();                       // язык по системному, пока сейв не загружен
  showScreen('menu');
  await withTimeout(gemBridge.init(), CONFIG.bridgeTimeoutMs + 200, null);
  const data = await store.get(CONFIG.saveKey);
  save = sanitize(data);
  store.ready = true;
  state = 'menu';
  applyLang();                       // язык из сейва перекрывает системный
  requestAnimationFrame(() => gemBridge.ready());   // интерфейс отрисован — сообщаем платформе
  analytics.hit('app_open', { platform: gemBridge.available ? 'gemspace' : 'web', lang: save.lang });
  if (!save.seenRules) openRules();
}
boot();
})();
</script>
