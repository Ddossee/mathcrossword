<style>
:root{
  /* Цвет: та же индиго-база и неон, что в 2048 Neon и «Крестиках-ноликах» */
  --bg:#0A0918;
  --surface:#141230;
  --surface-2:#1C1A40;
  --surface-3:#28255C;
  --line:rgba(160,150,255,.12);
  --text:#EEEBFF;
  --text-2:#9591C4;
  --x:#2EE8FF;                 /* действие игрока: выбор, поставленное число */
  --x-glow:rgba(46,232,255,.45);
  --ok:#3DFFA8;                /* пример сошёлся */
  --ok-glow:rgba(61,255,168,.38);
  --bad:#FF5A7A;               /* ошибка */
  --bad-glow:rgba(255,90,122,.45);
  --gold:#FFD35A;              /* только монеты и звёзды */
  --on-accent:#041219;

  /* Сетка 4 px */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;

  /* объём клеток: приподнятая плашка и углубление */
  --up:inset 0 1.5px 0 rgba(255,255,255,.09),inset 0 -1.5px 0 rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.45);
  --down:inset 0 0 0 1.5px rgba(46,232,255,.30),inset 0 2px 5px rgba(0,0,0,.5),
         inset 0 -1px 0 rgba(255,255,255,.05);

  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif;

  --r-s:12px;--r-m:16px;--r-l:22px;--r-pill:999px;
  --fast:120ms;--base:220ms;--slow:360ms;
  --ease:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);

  /* кнопка «Играть» и плашка уровня — один размер */
  --btn-w:min(58%,210px);--btn-h:48px;

  /* задаются из bridge.app.init() внутри Gem Space */
  --gem-safe-top:0px;
  --gem-safe-bottom:0px;

  /* задаются из fitBoard() */
  --cell:40px;--gap:4px;--pad:6px;
  --tile:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--text);font:400 17px/1.45 var(--f);
  background:
    radial-gradient(120% 70% at 50% -10%,#221B5E 0%,rgba(34,27,94,0) 60%),
    radial-gradient(80% 50% at 50% 110%,#2A0F4A 0%,rgba(42,15,74,0) 70%),
    var(--bg);
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
}
/* Точечная сетка на фоне: даёт ощущение листа, на котором лежит кроссворд */
body::before{content:'';position:fixed;inset:-40px;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(160,150,255,.21) 1px,transparent 1px);
  background-size:22px 22px;
  mask-image:radial-gradient(95% 85% at 50% 45%,#000 0%,rgba(0,0,0,.55) 65%,transparent 100%);
  -webkit-mask-image:radial-gradient(95% 85% at 50% 45%,#000 0%,rgba(0,0,0,.55) 65%,transparent 100%);
  animation:drift 48s linear infinite}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(22px,22px)}}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--x);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.caption{font:500 13px/1.35 var(--f);color:var(--text-2)}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#app{
  position:relative;z-index:1;height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;overflow:hidden;
  /* верх — только системный вырез: на Android хост уже ставит вебвью ниже своей шапки,
     и его safeAreaTop поверх давал лишнюю пустоту (замечание модерации по 2048) */
  /* Вне Gem Space сами отступаем от системного выреза. Внутри Gem Space вебвью
     уже стоит ниже шапки клиента, и env(safe-area-inset-top) там даёт вторую
     такую же полосу — на Android это та самая пустота сверху, из-за которой
     нижняя часть интерфейса не влезала. Поэтому в Gem Space берём только то,
     что прислал хост, и ограничиваем это сверху. */
  --pad-top:max(var(--s3),env(safe-area-inset-top));
  --pad-bottom:max(var(--s4),env(safe-area-inset-bottom));
  padding:var(--pad-top) var(--s4) var(--pad-bottom);
}
body.in-gem #app{
  --pad-top:min(calc(var(--s2) + var(--gem-safe-top)),16px);
  --pad-bottom:max(var(--s3),var(--gem-safe-bottom))}
.screen{display:flex;flex-direction:column;gap:var(--s3);flex:1 1 auto;min-height:0}
/* Смена экрана: содержимое приезжает снизу, чтобы переход читался как шаг вперёд */
.screen.enter{animation:screenIn var(--slow) var(--ease) both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen[hidden]{display:none}

/* ---------- Кнопки ---------- */
.btn{min-height:56px;padding:0 var(--s5);white-space:nowrap;border-radius:var(--r-pill);font-weight:700;
  transition:transform var(--fast) var(--ease),opacity var(--fast)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--x);color:var(--on-accent);box-shadow:0 0 28px var(--x-glow),inset 0 -2px 0 rgba(0,0,0,.15)}
.btn-quiet{min-height:44px;padding:0 var(--s4);color:var(--text-2);font-weight:600}
.icon-btn{width:44px;height:44px;flex:none;border-radius:var(--r-s);background:var(--surface);display:grid;place-items:center;
  color:var(--text);transition:transform var(--fast) var(--ease),background var(--fast)}
.icon-btn:active{transform:scale(.92);background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn .emoji{font-size:20px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Android Emoji",sans-serif}
.icon-btn .emoji.off{filter:grayscale(1) brightness(1.1);opacity:.7}
.coin{width:14px;height:14px;flex:none;color:var(--gold)}

/* ---------- Меню ---------- */
#menu{gap:var(--s4);justify-content:center}
.menu-scroll{min-height:0;overflow:visible;overscroll-behavior:contain;touch-action:pan-y;
  display:flex;flex-direction:column;justify-content:center;gap:var(--s5);flex:0 1 auto;padding-top:0}
.menu-scroll::-webkit-scrollbar{width:0;height:0}
.hero{display:grid;justify-items:center;gap:var(--s4);text-align:center}
/* Знаки действий загораются по очереди и гаснут — один цикл на четыре такта */
/* Живое превью: маленький кроссворд решает сам себя по кругу. Это и обложка,
   и объяснение правил без текста. Те же классы клеток, что в игре. */
.demo{--dcell:44px;--dgap:1px;position:relative;padding:6px}
.demo-grid{display:grid;gap:var(--dgap);justify-content:center}
.demo .cell{font-size:calc(var(--dcell) * .46)}
.demo .cell.d3{font-size:calc(var(--dcell) * .36)}
.demo .cell.gone{opacity:0;transform:scale(.9)}
/* Число в превью появляется так же, как в игре: клетка выбирается, затем в ней
   возникает число с той же пружинкой. Никаких летающих плиток и измерений
   координат — именно они давали запоздание и рывки. */
.demo .cell.s.pick{box-shadow:inset 0 0 0 2px var(--x),0 0 18px var(--x-glow)}
body.h-short .demo{--dcell:36px}
@media (max-width:330px){.demo{--dcell:34px}}
.card{background:var(--surface);border-radius:var(--r-pill);padding:0 var(--s3);display:grid;gap:var(--s1);
  align-self:center;width:var(--btn-w);min-height:var(--btn-h);align-content:center;white-space:nowrap}
.card .row{display:flex;justify-content:center;align-items:center;gap:var(--s3)}
.card b{font:600 13px/1.2 var(--f)}
.card .caption{font-size:12px}
.card .wallet b{font-size:12px}
.wallet{display:flex;gap:var(--s2);align-items:center}
.wallet span{display:inline-flex;align-items:center;gap:6px}
.wallet .star{width:14px;height:14px;color:var(--gold)}
.play-area{position:relative;display:grid;justify-items:center;gap:var(--s2);text-align:center}
#playBtn{width:var(--btn-w);min-height:var(--btn-h);padding:0 var(--s4);font-size:16px}
.menu-row{display:flex;justify-content:center;align-items:center;min-height:44px}
/* Бутерброд в левом верхнем углу: звук, язык, правила, сброс, выход */
.burger{position:absolute;left:var(--s4);top:var(--pad-top);
  z-index:5;box-shadow:inset 0 0 0 1px rgba(46,232,255,.35),0 0 14px rgba(46,232,255,.18)}
.sheet-item{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  min-height:52px;padding:0 var(--s4);border-radius:var(--r-s);background:var(--surface-2);
  font:600 16px/1.2 var(--f);text-align:left;color:var(--text);width:100%;
  transition:transform var(--fast) var(--ease),background var(--fast)}
.sheet-item:active{transform:scale(.98);background:var(--surface-3)}
.sheet-item .val{color:var(--x);font:700 14px/1 var(--f);letter-spacing:.04em}
#exitItem[hidden]{display:none}
.sheet-list{display:grid;gap:var(--s2);margin-top:var(--s4)}

/* ---------- Игра ---------- */
.topbar{display:flex;align-items:center;gap:var(--s2)}
.topbar .title{flex:1;min-width:0;display:grid;line-height:1.2}
.topbar .title b{font:600 17px/1.2 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coins{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 var(--s3);border-radius:var(--r-pill);
  background:var(--surface);font:600 17px/1 var(--f)}
.coins{transition:transform var(--fast) var(--ease)}
.coins.bump{animation:pop var(--slow) var(--spring)}
.coins.shake{animation:shake 240ms var(--ease)}
.main{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:var(--s3)}
.panel{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
/* Альбомная ориентация и низкие экраны: поле слева, банк и кнопки справа —
   иначе по вертикали не остаётся места ни на то, ни на другое. */
@media (orientation:landscape) and (max-height:560px){
  .main{flex-direction:row;align-items:stretch;gap:var(--s4)}
  .panel{width:40%;max-width:340px;flex:none;justify-content:center}
  .board-stage{flex:1 1 auto;margin-inline:0}
  .bank{margin-inline:0;max-height:60vh;overflow-y:auto}
  /* в альбомной ориентации играем на всю ширину, иначе панель справа не вмещает кнопки */
  #app{max-width:960px;padding-left:max(var(--s3),env(safe-area-inset-left));padding-right:max(var(--s3),env(safe-area-inset-right))}
  .panel{width:46%;max-width:380px}
  .menu-scroll{padding-top:0}
}
.board-stage{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  margin-inline:calc(var(--s4) * -1)}
/* Панели под полем нет: фигура кроссворда читается прямо на фоне экрана */
.board-wrap{position:relative;padding:var(--pad);max-width:100%;will-change:transform}
#board{display:grid;gap:var(--gap);touch-action:none}
.status{margin:0;min-height:18px;text-align:center;transition:color var(--base) var(--ease)}
/* Полоса показывает, сколько примеров уже сошлось. Где ошибка — не выдаёт. */
.hbar{height:3px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;flex:none;
  margin:calc(var(--s2) * -1) 0 calc(var(--s2) * -1)}
.hbar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);
  background:var(--ok);box-shadow:0 0 10px var(--ok-glow);transition:transform var(--slow) var(--ease)}
.topbar .title .caption{transition:color var(--base) var(--ease)}
/* Секундомер: спокойный, без тиканья и красного. Золотой «+N» рядом — пока
   бонус за скорость ещё достижим; время вышло — значок просто гаснет. */
.topbar .title .sub{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.topbar .title .sub .sep{opacity:.5}
.topbar .title .clock{font-variant-numeric:tabular-nums}
.tbonus{color:var(--gold);font-weight:700;transition:opacity var(--slow) var(--ease),transform var(--slow) var(--ease)}
.tbonus.gone{opacity:0;transform:scale(.8)}
.win-time{margin:var(--s1) 0 0;text-align:center;color:var(--text-2);font:600 15px/1.3 var(--f)}
.win-time b{color:var(--gold);font-weight:700}
.topbar .title .caption.bump{animation:pop var(--slow) var(--spring)}
.status.bad{color:var(--bad)}
.status.ok{color:var(--ok)}

/* Клетки поля. Анимируются только transform и opacity */
/* Клетки лежат встык, как в бумажном кроссворде: слова читаются сплошными полосами,
   а не набором отдельных плашек. Разделяет их только волосяная линия сетки. */
.cell{position:relative;display:grid;place-items:center;border-radius:3px;
  font:700 calc(var(--cell) * .5)/1 var(--f);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  transition:transform var(--fast) var(--ease),background var(--base) var(--ease),color var(--base) var(--ease),
    box-shadow var(--base) var(--ease),opacity var(--base) var(--ease)}
.cell.d3{font-size:calc(var(--cell) * .4);letter-spacing:-.06em}
/* Клетки различаются не цветом обводки, а объёмом: напечатанные — приподнятые
   плашки, пустые — углубления. Рамка в полтора пикселя не читалась на мелких
   клетках «Эксперта», а свет и тень видны при любом размере. */
.cell.n{background:var(--surface-2);color:var(--text);box-shadow:var(--up)}
.cell.o,.cell.e{background:var(--surface-2);color:var(--text-2);font-weight:600;box-shadow:var(--up)}
.cell.s{background:#0D0B20;color:var(--x);cursor:pointer;box-shadow:var(--down)}
.cell.s.sel{box-shadow:inset 0 0 0 2px var(--x),0 0 16px var(--x-glow)}
.cell.s.tgt{background:var(--surface-3);box-shadow:inset 0 0 0 2px var(--x),0 0 18px var(--x-glow)}
/* Число, поставленное игроком, всегда зелёное — этим оно и отличается от
   напечатанных на поле. Верно решённый пример поле никак не подсвечивает. */
.cell.s.f{background:var(--surface-3);color:var(--ok);
  box-shadow:inset 0 0 0 1.5px rgba(61,255,168,.5),var(--up)}
.cell.s.f.sel{box-shadow:inset 0 0 0 2.5px var(--x),0 0 22px var(--x-glow)}
/* Клетка от подсказки — то же зелёное число, но пунктиром: поставил не игрок */
.cell.s.lk{color:var(--ok);cursor:default;background:var(--surface-3);box-shadow:var(--up);
  outline:1.5px dashed rgba(61,255,168,.8);outline-offset:-3px}

.cell.lift{opacity:.3}
/* Появление поля: клетки проявляются волной от левого верхнего угла */
.cell.in{animation:cellIn 320ms var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes cellIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
/* Клетка во время анимации растёт до 108% и налезает на соседей справа и снизу:
   они идут позже в разметке и рисуются поверх, из-за чего край рамки пропадал
   до конца анимации. Анимируемая клетка должна лежать выше всех остальных,
   поэтому её правило идёт последним и с большим значением. */
.cell.f,.cell.sel,.cell.tgt,.cell.lk{z-index:2}
.cell.flash,.cell.shake{z-index:5}
.cell.pop{z-index:6}
.cell.pop{animation:pop var(--slow) var(--spring)}
.cell.flash{animation:flash 520ms var(--ease)}
.cell.shake{animation:shake 300ms var(--ease)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes flash{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* Банк чисел: у каждой плитки свой домик, место не схлопывается */
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2);padding:var(--s3) var(--s2);margin-inline:calc(var(--s3) * -1);
  background:var(--surface);border-radius:var(--r-l);touch-action:none;min-height:calc(var(--tile) + 24px)}
.tile{min-width:var(--tile);height:var(--tile);padding:0 var(--s1);letter-spacing:-.03em;border-radius:var(--r-s);
  position:relative;background:var(--surface-3);color:var(--ok);box-shadow:var(--up);
  font:700 calc(var(--tile) * .44)/1 var(--f);
  font-variant-numeric:tabular-nums;display:grid;place-items:center;cursor:grab;touch-action:none;
  transition:transform var(--fast) var(--ease),opacity var(--fast)}
.tile:active{transform:scale(.94)}
.tile.sel{background:var(--ok);color:#052617;box-shadow:0 0 20px var(--ok-glow);transform:translateY(-3px)}
.tile.in{animation:tileIn 300ms var(--spring) both;animation-delay:var(--d,0ms)}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.tile.pop{animation:pop var(--slow) var(--spring)}
.tile{transition:transform var(--fast) var(--ease),opacity var(--fast),background var(--base) var(--ease),
  color var(--base) var(--ease),box-shadow var(--base) var(--ease)}
.tile.home{background:transparent;color:transparent;box-shadow:var(--down);opacity:.6;pointer-events:none}
.ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;min-width:52px;height:52px;padding:0 var(--s2);
  border-radius:var(--r-s);background:var(--ok);color:#052617;font:700 22px/1 var(--f);
  font-variant-numeric:tabular-nums;display:grid;place-items:center;box-shadow:0 0 28px var(--ok-glow),0 12px 30px rgba(0,0,0,.4);
  will-change:transform}
.ghost{transition:opacity var(--fast) var(--ease)}
.ghost.up{animation:ghostUp 140ms var(--spring) both}
@keyframes ghostUp{from{opacity:.4}to{opacity:1}}
.ghost[hidden]{display:none}
.tools{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.tools .left{display:flex;gap:var(--s2)}
.icon-btn:disabled{opacity:.35;cursor:default}
.hint-btn{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:var(--r-pill);
  background:var(--surface);color:var(--text);font:600 15px/1 var(--f);
  box-shadow:inset 0 0 0 1px rgba(255,211,90,.32),0 0 14px rgba(255,211,90,.10);
  transition:transform var(--fast) var(--ease),opacity var(--fast)}
.hint-btn:active{transform:scale(.95)}
.hint-btn svg.bulb{width:20px;height:20px;color:var(--gold)}
.hint-btn .cost{display:inline-flex;align-items:center;gap:4px;color:var(--text-2)}
.hint-btn.poor{opacity:.55}

/* Низкий экран: отдаём полю всё, что можно, тач-цели не меньше 44 px */
body.h-short #game{gap:var(--s2)}
body.h-short .bank{padding:var(--s2)}
body.h-short .menu-scroll{gap:var(--s4);padding-top:0}
@media (max-width:350px){
  .coins{padding:0 var(--s2)}
  .topbar{gap:var(--s1)}
  .topbar .title b{font-size:15px}
  /* на самых узких экранах в шапке остаётся секундомер, «осталось N» дублирует полоса прогресса */
  .topbar .title .sub #gLeft,.topbar .title .sub .sep{display:none}
  .sheet h2{font-size:24px}
  /* на самых узких экранах у подсказки остаётся значок и цена — слово не влезает */
  .hint-btn .label{display:none}
  .hint-btn{padding:0 var(--s3);gap:var(--s1)}
  #app{padding-left:var(--s3);padding-right:var(--s3)}
}
.hint-btn{min-width:0}

/* ---------- Оверлеи ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:var(--s4);
  background:rgba(6,5,16,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:opacity var(--base) var(--ease),visibility 0s linear var(--base)}
.overlay.show{opacity:1;visibility:visible;transition:opacity var(--base) var(--ease),visibility 0s}
/* Кнопка внизу листа всегда видна: прокручивается только текст, не весь лист */
.sheet{width:min(100%,400px);max-height:100%;overflow:hidden;background:var(--surface);border-radius:var(--r-l);
  padding:var(--s5) var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s2);touch-action:pan-y;
  box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.5);
  transform:translateY(12px) scale(.98);transition:transform var(--slow) var(--spring)}
.overlay.show .sheet{transform:none}
.sheet h2{margin:0;font:800 26px/1.15 var(--f);letter-spacing:-.02em;text-align:center}
.sheet p{margin:0}
.sheet > *{flex:none}
.sheet .rules,.sheet .sheet-list{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.sheet .actions{display:grid;gap:var(--s2);margin-top:var(--s4)}
.stars{display:flex;justify-content:center;gap:var(--s3);margin:var(--s4) 0 var(--s2)}
.stars svg{width:44px;height:44px;color:var(--surface-3)}
.stars svg.on{color:var(--gold);filter:drop-shadow(0 0 10px rgba(255,211,90,.55));animation:pop var(--slow) var(--spring) both}
.stars svg.on:nth-child(2){animation-delay:120ms}
.stars svg.on:nth-child(3){animation-delay:240ms}
.reward{display:flex;align-items:center;justify-content:center;gap:var(--s2);font:800 34px/1 var(--f);color:var(--gold)}
.reward .coin{width:28px;height:28px}
#winNote{text-align:center}
.rules{display:grid;gap:var(--s3);margin-top:var(--s3)}
.rules p{color:var(--text);font-size:15px;line-height:1.45}
.rules p b{color:var(--x);font-weight:600}
.rules p b.g{color:var(--ok)}
.rules p b.p{color:var(--gold)}
.toast{position:fixed;left:50%;top:calc(max(var(--s3),env(safe-area-inset-top)) + 60px);z-index:25;
  max-width:min(90vw,360px);padding:var(--s3) var(--s4);border-radius:var(--r-m);background:var(--surface-3);
  color:var(--text);font:500 15px/1.35 var(--f);text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.4);
  opacity:0;transform:translate(-50%,-8px);pointer-events:none;transition:opacity var(--base) var(--ease),transform var(--base) var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="app">

  <!-- ===== МЕНЮ ===== -->
  <section id="menu" class="screen">
    <button class="icon-btn burger" id="burgerBtn" data-i18n-aria="menuAria" aria-label="Меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="menu-scroll">
      <div class="hero">
        <div class="demo" id="demo" aria-hidden="true">
          <div class="demo-grid" id="demoGrid"></div>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <b class="num" id="mLevel">Уровень 1</b>
          <span class="wallet num">
            <span><svg class="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#0A0918" stroke-opacity=".35" stroke-width="1.6"/></svg><b class="caption" id="mCoins">0</b></span>
            <span><svg class="star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg><b class="caption" id="mStars">0</b></span>
          </span>
        </div>
      </div>
    </div>

    <div class="play-area">
      <button class="btn btn-primary" id="playBtn" disabled></button>
      <div class="menu-row"><button class="btn-quiet" id="rulesBtn" data-i18n="rulesBtn">Как играть</button></div>
    </div>
  </section>

  <!-- ===== ИГРА ===== -->
  <section id="game" class="screen" hidden>
    <div class="topbar">
      <button class="icon-btn" id="backBtn" data-i18n-aria="menu" aria-label="В меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="title"><b class="num" id="gLevel">Уровень 1</b>
        <span class="caption num sub"><span id="gLeft"></span><span class="sep">·</span><span class="clock" id="gTime">0:00</span><span class="tbonus" id="gBonus"></span></span></div>
      <span class="coins num" id="gCoinsBox"><svg class="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#0A0918" stroke-opacity=".35" stroke-width="1.6"/></svg><span id="gCoins">0</span></span>
      <button class="icon-btn" id="soundBtn" aria-label="Звук"></button>
    </div>

    <div class="hbar"><i id="gBar"></i></div>
    <div class="main">
    <div class="board-stage" id="stage">
      <div class="board-wrap" id="boardWrap"><div id="board" role="grid" aria-label="Игровое поле"></div></div>
    </div>

    <div class="panel">
    <p class="status caption" id="status" aria-live="polite"></p>
    <div class="bank" id="bank" aria-label="Числа"></div>

    <div class="tools">
      <span class="left">
      <button class="icon-btn" id="undoBtn" data-i18n-aria="undoAria" aria-label="Отменить ход" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-5-4 5-4"/><path d="M4 10h9a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="icon-btn" id="resetBtn" data-i18n-aria="resetAria" aria-label="Вернуть все числа в банк"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
      </span>
      <button class="hint-btn" id="hintBtn">
        <svg class="bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
        <span class="label" data-i18n="hint">Подсказка</span>
        <span class="cost num"><svg class="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/></svg><span id="hintCost">15</span></span>
      </button>
    </div>
    </div>
    </div>
  </section>
</div>

<div class="ghost" id="ghost" hidden></div>
<div class="toast" id="toast" role="status"></div>

<!-- ===== ПОБЕДА ===== -->
<div class="overlay" id="winOv" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="sheet">
    <h2 id="winTitle" data-i18n="winTitle">Уровень пройден</h2>
    <div class="stars" id="winStars">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>
    </div>
    <div class="reward num"><span id="winReward">+0</span><svg class="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#0A0918" stroke-opacity=".35" stroke-width="1.6"/></svg></div>
    <p class="win-time num" id="winTime"></p>
    <p class="caption" id="winNote"></p>
    <div class="actions">
      <button class="btn btn-primary" id="nextBtn" data-i18n="next">Следующий уровень</button>
      <button class="btn-quiet" id="winMenuBtn" data-i18n="menu">В меню</button>
    </div>
  </div>
</div>

<!-- ===== БУТЕРБРОД ===== -->
<div class="overlay" id="menuOv" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <div class="sheet">
    <h2 id="menuTitle" data-i18n="menuTitle">Меню</h2>
    <div class="sheet-list">
      <button class="sheet-item" id="soundItem"><span data-i18n="soundLabel">Звук</span><span class="val" id="soundVal"></span></button>
      <button class="sheet-item" id="langItem"><span data-i18n="langLabel">Язык</span><span class="val" id="langVal">RU</span></button>
      <button class="sheet-item" id="exitItem" hidden><span data-i18n="exitAria">Закрыть игру</span></button>
    </div>
    <div class="actions"><button class="btn btn-primary" id="menuClose" data-i18n="close">Закрыть</button></div>
  </div>
</div>

<!-- ===== ПРАВИЛА ===== -->
<div class="overlay" id="rulesOv" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
  <div class="sheet">
    <h2 id="rulesTitle" data-i18n="rulesTitle">Как играть</h2>
    <div class="rules">
      <p data-i18n-html="rule1"></p>
      <p data-i18n-html="rule2"></p>
      <p data-i18n-html="rule3"></p>
      <p data-i18n-html="rule4"></p>
      <p data-i18n-html="rule5"></p>
      <p data-i18n-html="rule6"></p>
      <p data-i18n-html="ruleTimer"></p>
      <p data-i18n-html="rule7"></p>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="rulesOk" data-i18n="rulesOk">Понятно</button>
    </div>
  </div>
</div>

(() => {
'use strict';

/* =====================================================================
   CONFIG — все числа баланса здесь
   ===================================================================== */
const CONFIG = {
  saveKey: 'knstrkt-chislovord-v1',
  genVersion: 2,                  // смена генератора — недоигранные уровни старой версии пересоздаются
  seedSalt: 0x5C1A,
  startCoins: 30,
  hintCost: 15,
  // Секундомер: контрольное время уровня = база + секунды на каждую пустую клетку.

  parPerBlankSec: 8,
  fastBonusShare: 0.5,
  undoDepth: 60,                  // сколько ходов держим для отмены

  starCoins: [0, 0.5, 0.75, 1],   // доля награды уровня за 1 / 2 / 3 звезды
  gemTopMaxPx: 16,                // предел верхнего отступа внутри Gem Space
  bridgeTimeoutMs: 1500,
  maxCellPx: 64,                  // верхний предел; фактический размер считает fitBoard по ширине экрана
  bankMaxRows: 3,                 // банк не выше трёх рядов: плитки ужимаются
  bankTileMin: 28,
  bankTileComfort: 40,            // ниже этого размера плитки раскладываем в лишний ряд
  bankTileMax: 52,
  bankHeightShare: .24,
  bankHeightShareLand: .5,        // в альбомной раскладке банк стоит сбоку, там ему можно выше           // доля высоты экрана, больше которой банк не вырастает

  dragThresholdPx: 8,
  dropRadius: 0.85,               // радиус «примагничивания» при броске, в размерах клетки
  touchLiftPx: 40,                // призрак плитки поднят над пальцем, чтобы число было видно
  keyComboMs: 700,                // ожидание второй цифры при вводе с клавиатуры
  shortScreenPx: 640,
  // Возможные формы поля: [столбцы, строки]. Для уровня выбирается любая,
  // в которую помещается нужное число примеров.
  shapes: [[9, 9], [11, 9], [9, 11], [11, 11], [13, 9], [9, 13], [13, 11], [11, 13], [13, 13],
           [15, 13], [13, 15], [15, 15]],
  tiers: [
    { id: 'easy',   name: 'Лёгкий',  from: 1,  cols: 9,  rows: 9, eq: [10, 12], ops: ['+', '−'],
      max: 20,  longShare: 0,  blankRatio: [.30, .40], decoys: [0, 0], reward: 10 },
    { id: 'medium', name: 'Средний', from: 9,  cols: 9,  rows: 11, eq: [12, 15], ops: ['+', '−', '×', '÷'],
      max: 50,  longShare: 0,  blankRatio: [.40, .50], decoys: [0, 0], reward: 15 },
    { id: 'hard',   name: 'Сложный', from: 26, cols: 11, rows: 13, eq: [15, 18], ops: ['+', '−', '×', '÷'],
      max: 100, longShare: 0,  blankRatio: [.48, .56], decoys: [0, 1], reward: 20 },
    { id: 'expert', name: 'Эксперт', from: 51, span: 50, cols: 11, rows: 13, eq: [18, 22], ops: ['+', '−', '×', '÷'],
      max: 100, longShare: .3, blankRatio: [.50, .60], decoys: [2, 4], reward: 30 },
  ],
  sounds: {
    pick:   { freq: 420, to: 480, dur: .06, gain: .05, type: 'sine' },
    place:  { freq: 560, to: 720, dur: .09, gain: .07, type: 'sine' },

    hint:   { freq: 880, to: 1320, dur: .18, gain: .06, type: 'sine' },
    ok:     [660, 880],
    win:    [523, 659, 784, 1046],
  },
};

/* =====================================================================
   Языки: русский и английский
   ===================================================================== */
const I18N = {
  ru: {
    title: 'Математический кроссворд',
    level: (v) => 'Уровень ' + v.n,
    loading: 'Загрузка…', play: 'Играть',
    rulesBtn: 'Как играть', rulesTitle: 'Как играть', rulesOk: 'Понятно',
    menuTitle: 'Меню', menuAria: 'Открыть меню', close: 'Закрыть',
    soundLabel: 'Звук', langLabel: 'Язык', on: 'Вкл', off: 'Выкл',
    rule1: 'Перетащите число из банка в пустую клетку. Или коснитесь числа, а потом клетки.',
    rule2: 'Сойтись должны <b>все</b> примеры сразу — и по строкам, и по столбцам. Клетка на пересечении работает на два примера одновременно.',
    rule3: 'Сначала умножение и деление, потом сложение и вычитание — как в школе. Деление всегда без остатка.',
    rule4: 'Ваши числа на поле <b class="g">зелёные</b>. Где ошибка, игра не показывает: если все клетки заполнены, а уровень не засчитан, значит какой-то пример не сходится — ищите сами.',

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;

/* =====================================================================
   Генератор уровней (чистые функции, детерминирован по номеру уровня)
   ===================================================================== */
function mulberry32(a) {

    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}

function applyOp(a, op, b) {

  if (op === '−') return a - b;
  if (op === '×') return a * b;
  if (op === '÷') return (b !== 0 && a % b === 0) ? a / b : NaN;

}
// Левая часть примера с приоритетом: сначала × и ÷, потом + и − слева направо.
// strict — для генератора: ни одно промежуточное значение не меньше 1.
function evalLhs(nums, ops, strict) {
  const n = [nums[0]], o = [];
  for (let i = 0; i < ops.length; i++) {
    const op = ops[i], b = nums[i + 1];
    if (op === '×' || op === '÷') {
      const v = applyOp(n[n.length - 1], op, b);
      if (!Number.isFinite(v) || (strict && v < 1)) return NaN;
      n[n.length - 1] = v;
    } else { o.push(op); n.push(b); }
  }
  let v = n[0];
  for (let i = 0; i < o.length; i++) {
    v = applyOp(v, o[i], n[i + 1]);
    if (strict && v < 1) return NaN;
  }

}

// Пример из двух чисел: [a, op, b, '=', c]. fixIdx — индекс токена, значение которого задано (пересечение).
function make2(r, T, fixIdx, F) {
  const max = T.max;
  for (let tries = 0; tries < 40; tries++) {
    const op = pick(r, T.ops);
    let a, b, c;
    if (op === '+') {
      if (fixIdx === 4) { if (F < 2) continue; a = ri(r, 1, F - 1); b = F - a; c = F; }
      else if (fixIdx === 0) { if (F >= max) continue; a = F; b = ri(r, 1, max - F); c = a + b; }
      else if (fixIdx === 2) { if (F >= max) continue; b = F; a = ri(r, 1, max - F); c = a + b; }
      else { c = ri(r, 2, max); a = ri(r, 1, c - 1); b = c - a; }
    } else if (op === '−') {
      if (fixIdx === 4) { if (F >= max) continue; b = ri(r, 1, max - F); a = F + b; c = F; }
      else if (fixIdx === 0) { if (F < 2) continue; a = F; b = ri(r, 1, F - 1); c = a - b; }
      else if (fixIdx === 2) { if (F >= max) continue; b = F; a = ri(r, F + 1, max); c = a - b; }
      else { a = ri(r, 2, max); b = ri(r, 1, a - 1); c = a - b; }
    } else if (op === '×') {
      if (fixIdx === 4) { const ds = divisors(F); if (!ds.length) continue; a = pick(r, ds); b = F / a; c = F; }
      else if (fixIdx === 0 || fixIdx === 2) {
        if (F < 2 || F * 2 > max) continue;
        const other = ri(r, 2, Math.min(12, Math.floor(max / F)));
        if (fixIdx === 0) { a = F; b = other; } else { a = other; b = F; }
        c = a * b;
      } else {
        a = ri(r, 2, Math.min(12, Math.floor(max / 2)));
        const hi = Math.min(12, Math.floor(max / a)); if (hi < 2) continue;
        b = ri(r, 2, hi); c = a * b;
      }
    } else { // ÷ : a ÷ b = c, a = b·c
      if (fixIdx === 4) { if (F * 2 > max) continue; b = ri(r, 2, Math.min(12, Math.floor(max / F))); a = F * b; c = F; }
      else if (fixIdx === 0) { const ds = divisors(F); if (!ds.length) continue; b = pick(r, ds); a = F; c = F / b; }
      else if (fixIdx === 2) { if (F < 2 || F * 2 > max) continue; b = F; c = ri(r, 2, Math.min(12, Math.floor(max / F))); a = b * c; }
      else {
        b = ri(r, 2, Math.min(12, Math.floor(max / 2)));
        const hi = Math.min(12, Math.floor(max / b)); if (hi < 2) continue;
        c = ri(r, 2, hi); a = b * c;
      }
    }
    if ([a, b, c].every((v) => Number.isInteger(v) && v >= 1 && v <= max)) return [a, op, b, '=', c];
  }
  return null;
}

// Пример из трёх чисел: [a, op1, b, op2, c, '=', d] — только для «Эксперта».
function make3(r, T, fixIdx, F) {
  const small = Math.min(12, T.max), addMax = Math.min(T.max, 30);
  for (let tries = 0; tries < 400; tries++) {
    const o1 = pick(r, T.ops), o2 = pick(r, T.ops);
    const m1 = o1 === '×' || o1 === '÷', m2 = o2 === '×' || o2 === '÷';
    const nums = [
      m1 ? ri(r, 2, small) : ri(r, 1, addMax),
      (m1 || m2) ? ri(r, 2, small) : ri(r, 1, addMax),
      m2 ? ri(r, 2, small) : ri(r, 1, addMax),
    ];
    if (o1 === '÷') nums[0] = nums[1] * ri(r, 2, 6);
    if (o2 === '÷' && !m1) nums[1] = nums[2] * ri(r, 2, 6);
    if (fixIdx !== null && fixIdx < 6) nums[fixIdx / 2] = F;
    if (fixIdx === 6) {
      // результат задан — подбираем последнее число, если второй знак + или −
      if (m2) continue;
      const left = evalLhs([nums[0], nums[1]], [o1], true);
      if (!Number.isInteger(left)) continue;
      nums[2] = o2 === '+' ? F - left : left - F;
    }
    if (nums.some((v) => !Number.isInteger(v) || v < 1 || v > T.max)) continue;
    const res = evalLhs(nums, [o1, o2], true);
    if (!Number.isInteger(res) || res < 1 || res > T.max) continue;
    if (fixIdx === 6 && res !== F) continue;
    return [nums[0], o1, nums[1], o2, nums[2], '=', res];
  }
  return null;
}
const makeEq = (r, T, len, fixIdx, F) => (len === 5 ? make2(r, T, fixIdx, F) : make3(r, T, fixIdx, F));

// Раскладка примеров по сетке по правилам кроссворда: пересечения только по числам,
// слова не касаются друг друга боками и торцами.
function tryBuild(r, T, eqTarget) {
  const R = T.rows, C = T.cols, grid = new Map(), eqs = [];
  const K = (y, x) => y * 100 + x;
  const inB = (y, x) => y >= 0 && y < R && x >= 0 && x < C;
  const has = (y, x) => inB(y, x) && grid.has(K(y, x));
  const lenFor = (dir) => { const L = r() < T.longShare ? 7 : 5; return L <= (dir === 'h' ? C : R) ? L : 5; };

  // Длина сплошной цепочки клеток через (y,x) поперёк направления dir, считая саму клетку
  function crossRun(y, x, dir) {
    const dy = dir === 'h' ? 1 : 0, dx = dir === 'h' ? 0 : 1;   // поперечное направление
    let n = 1;
    for (let i = 1; has(y + dy * i, x + dx * i); i++) n++;
    for (let i = 1; has(y - dy * i, x - dx * i); i++) n++;
    return n;
  }
  // Примеры кладутся плотно, бок о бок — как в классическом кроссворде. Запрещено
  // только то, что читается как лишний пример: цепочка из трёх и более клеток,
  // не являющаяся примером, и продолжение примера за его края.
  function canPlace(len, dir, y0, x0, k) {
    const dy = dir === 'v' ? 1 : 0, dx = dir === 'h' ? 1 : 0;
    if (!inB(y0, x0) || !inB(y0 + dy * (len - 1), x0 + dx * (len - 1))) return false;
    if (has(y0 - dy, x0 - dx) || has(y0 + dy * len, x0 + dx * len)) return false;
    for (let i = 0; i < len; i++) {
      if (i === k) continue;
      const y = y0 + dy * i, x = x0 + dx * i;
      if (has(y, x)) return false;
      if (crossRun(y, x, dir) > 2) return false;
    }
    return true;
  }
  function put(tok, dir, y0, x0) {
    const id = eqs.length, keys = [];
    const dy = dir === 'v' ? 1 : 0, dx = dir === 'h' ? 1 : 0;
    tok.forEach((v, i) => {
      const y = y0 + dy * i, x = x0 + dx * i, key = K(y, x);
      let c = grid.get(key);
      if (!c) {
        c = { y, x, type: i % 2 === 0 ? 'num' : (v === '=' ? 'eq' : 'op'), val: v, h: false, v: false };
        grid.set(key, c);
      }
      c[dir] = true;
      keys.push(key);
    });
    eqs.push({ id, dir, keys });
  }

  const d0 = r() < 0.5 ? 'h' : 'v', L0 = lenFor(d0);
  const t0 = makeEq(r, T, L0, null, null);
  if (!t0) return null;
  const y0 = d0 === 'h' ? ri(r, Math.floor(R / 4), Math.ceil(R * 3 / 4) - 1) : ri(r, 0, R - L0);
  const x0 = d0 === 'h' ? ri(r, 0, C - L0) : ri(r, Math.floor(C / 4), Math.ceil(C * 3 / 4) - 1);
  put(t0, d0, y0, x0);

  let guard = 0;
  while (eqs.length < eqTarget && guard++ < 250) {
    const cands = [];
    grid.forEach((c) => { if (c.type === 'num' && !(c.h && c.v)) cands.push(c); });
    if (!cands.length) break;
    const c = pick(r, cands), dir = c.h ? 'v' : 'h', L = lenFor(dir);
    const slots = shuffle(r, L === 5 ? [0, 2, 4] : [0, 2, 4, 6]);
    for (const k of slots) {
      const y = dir === 'v' ? c.y - k : c.y, x = dir === 'h' ? c.x - k : c.x;
      if (!canPlace(L, dir, y, x, k)) continue;
      const tok = makeEq(r, T, L, k, c.val);
      if (!tok) continue;
      put(tok, dir, y, x);
      break;
    }
  }

}

function tierIndex(level) {
  let ti = 0;
  CONFIG.tiers.forEach((T, i) => { if (level >= T.from) ti = i; });
  return ti;
}
// Форма поля не привязана к сложности: на любом уровне может выпасть как
// вытянутая по вертикали сетка, так и широкая. Выбор детерминирован номером уровня.
function pickShape(level, eqTarget) {
  const need = eqTarget * 7;                         // грубая оценка нужной площади
  const fit = CONFIG.shapes.filter((sh) => sh[0] * sh[1] >= need);
  const list = fit.length ? fit : [CONFIG.shapes[CONFIG.shapes.length - 1]];
  const r = mulberry32(hashSeed(level * 7919 + 13));
  r(); r();
  return list[Math.floor(r() * list.length)];
}
function levelParams(level) {
  const ti = tierIndex(level), T0 = CONFIG.tiers[ti], N = CONFIG.tiers[ti + 1];
  const span = N ? N.from - T0.from : T0.span;
  const t = span > 1 ? clamp((level - T0.from) / (span - 1), 0, 1) : 0;
  const eqTarget = Math.round(lerp(T0.eq[0], T0.eq[1], t));
  const sh = pickShape(level, eqTarget);
  const T = Object.assign({}, T0, { cols: sh[0], rows: sh[1] });
  return {
    ti, T, t, span, eqTarget,
    decoys: Math.round(lerp(T0.decoys[0], T0.decoys[1], t)),
  };
}

function finalize(b, P, r) {
  const T = P.T;
  const list = [...b.grid.values()].sort((p, q) => p.y - q.y || p.x - q.x);
  let minY = Infinity, minX = Infinity, maxY = -Infinity, maxX = -Infinity;
  list.forEach((c) => { minY = Math.min(minY, c.y); minX = Math.min(minX, c.x); maxY = Math.max(maxY, c.y); maxX = Math.max(maxX, c.x); });
  const index = new Map();
  list.forEach((c, i) => index.set(c.y * 100 + c.x, i));
  const cells = list.map((c) => ({ y: c.y - minY, x: c.x - minX, t: c.type === 'num' ? 'n' : c.type === 'eq' ? 'e' : 'o', v: c.val, b: false }));
  const eqs = b.eqs.map((e) => e.keys.map((k) => index.get(k)));
  const eqOf = cells.map(() => []);
  eqs.forEach((e, ei) => e.forEach((ci) => eqOf[ci].push(ei)));

  const nums = [];
  cells.forEach((c, i) => { if (c.t === 'n') nums.push(i); });
  let want = Math.round(nums.length * lerp(T.blankRatio[0], T.blankRatio[1], P.t));
  want = clamp(want, 1, nums.length - 1);
  // в каждом примере остаётся хотя бы одно открытое число — есть за что зацепиться
  const visible = eqs.map((e) => e.filter((ci) => cells[ci].t === 'n').length);
  let count = 0;
  const blankIt = (ci) => { cells[ci].b = true; eqOf[ci].forEach((ei) => visible[ei]--); count++; };
  const canBlank = (ci) => !cells[ci].b && eqOf[ci].every((ei) => visible[ei] > 1);
  // сначала — хотя бы одна пустая клетка в каждом примере, иначе он решён заранее;
  // пересечения в приоритете: одна клетка закрывает сразу два примера
  for (const ei of shuffle(r, eqs.map((_, i) => i))) {
    if (eqs[ei].some((ci) => cells[ci].b)) continue;
    const opts = shuffle(r, eqs[ei].filter((ci) => cells[ci].t === 'n' && canBlank(ci)));
    opts.sort((a, c) => eqOf[c].length - eqOf[a].length);
    if (opts.length) blankIt(opts[0]);
  }
  for (const ci of shuffle(r, nums.slice())) {
    if (count >= want) break;
    if (canBlank(ci)) blankIt(ci);
  }
  const sol = cells.filter((c) => c.b).map((c) => c.v);
  const bank = sol.slice();
  for (let d = 0; d < P.decoys; d++) {
    let v = pick(r, sol) + (r() < 0.5 ? -1 : 1) * ri(r, 1, 4);
    if (v < 1 || v > T.max) v = ri(r, 1, Math.min(T.max, 30));
    bank.push(v);
  }
  bank.sort((a, c) => a - c);
  return { gen: CONFIG.genVersion, rows: maxY - minY + 1, cols: maxX - minX + 1, cells, eqs, bank };
}

function generate(level) {
  const P = levelParams(level);
  const r = mulberry32(hashSeed(level));
  let best = null;
  for (let a = 0; a < 80; a++) {
    const b = tryBuild(r, P.T, P.eqTarget);
    if (!b) continue;
    if (!best || b.eqs.length > best.eqs.length) best = b;
    if (b.eqs.length >= P.eqTarget) break;
  }
  if (!best) best = tryBuild(r, CONFIG.tiers[0], 10);   // страховка, на практике не срабатывает
  const pz = finalize(best, P, r);
  pz.level = level;
  return pz;
}

/* =====================================================================
   Мост с Gem Space. SDK вшит в файл выше (MIT) — игра не ходит в сеть.
   Без app.ready() платформа показывает «Невозможно подключиться к серверу».
   ===================================================================== */
function withTimeout(promise, ms, fallback) {
  return new Promise((resolve) => {
    let settled = false;
    const timer = setTimeout(() => { if (!settled) { settled = true; resolve(fallback); } }, ms);
    Promise.resolve(promise).then(
      (v) => { if (!settled) { settled = true; clearTimeout(timer); resolve(v); } },
      () => { if (!settled) { settled = true; clearTimeout(timer); resolve(fallback); } }
    );
  });
}
function applyGemViewport(initData) {
  const vp = initData && initData.viewport;
  const root = document.documentElement.style;
  document.body.classList.add('in-gem');     // отключает env(safe-area) — его даёт хост
  if (!vp) return;
  const px = (v) => clamp(Number(v) || 0, 0, CONFIG.gemTopMaxPx) + 'px';
  if (typeof vp.safeAreaTop === 'number') root.setProperty('--gem-safe-top', px(vp.safeAreaTop));
  if (typeof vp.safeAreaBottom === 'number') root.setProperty('--gem-safe-bottom', (clamp(Number(vp.safeAreaBottom) || 0, 0, 48)) + 'px');
}
const gemBridge = {
  available: false,
  bridge: null,
  async init() {
    if (typeof GemSpaceBridge === 'undefined' || !GemSpaceBridge.bridge) return;
    this.bridge = GemSpaceBridge.bridge;
    let initData = null;
    try { initData = await withTimeout(this.bridge.app.init(), CONFIG.bridgeTimeoutMs, null); } catch (e) { initData = null; }
    if (initData) { this.available = true; applyGemViewport(initData); }
  },
  async ready() {
    // Шлём даже если init не ответил вовремя: медленный старт хоста не должен
    // превращаться в «Невозможно подключиться к серверу». Вне Gem Space вызов
    // сразу отклоняется SDK и ни на что не влияет.
    if (!this.bridge) return;
    try { await withTimeout(this.bridge.app.ready(), CONFIG.bridgeTimeoutMs, null); } catch (e) { /* не критично */ }
  },
  async close() {
    if (!this.available) return;
    try { await withTimeout(this.bridge.app.close(), CONFIG.bridgeTimeoutMs, null); } catch (e) { /* не критично */ }
  },
};

/* =====================================================================
   Сохранение: Gem Space → window.storage (артефакт) → localStorage → память
   ===================================================================== */
const store = {
  ready: false,   // до загрузки сейва ничего не пишем, иначе затрём прогресс
  parse(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'object') return v;       // часть реализаций отдаёт готовый объект
    try { return JSON.parse(v); } catch (e) { return null; }
  },
  async get(key) {
    try {
      if (gemBridge.available) {
        const r = await withTimeout(gemBridge.bridge.storage.get({ key }), CONFIG.bridgeTimeoutMs * 2, null);
        return this.parse(r && r.value);
      }
      if (window.storage && typeof window.storage.get === 'function') {
        const r = await window.storage.get(key);
        return this.parse(r && r.value);
      }
    } catch (e) { /* ключа нет — идём дальше */ }
    try { return this.parse(localStorage.getItem(key)); } catch (e) { return null; }
  },
  async set(key, value) {
    if (!this.ready) return;
    const raw = JSON.stringify(value);
    try {
      if (gemBridge.available) { await gemBridge.bridge.storage.set({ key, value: raw }); return; }
      if (window.storage && typeof window.storage.set === 'function') { await window.storage.set(key, raw); return; }
    } catch (e) { /* падаем на localStorage */ }
    try { localStorage.setItem(key, raw); } catch (e) { /* только память */ }
  },
};

/* =====================================================================
   Звук и вибрация (Web Audio, без файлов)
   ===================================================================== */
const audio = {
  ctx: null,
  init() {
    if (this.ctx) return;
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } catch (e) { this.ctx = null; }
  },
  resume() {
    if (!save.sound) return;
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  blip(cfg, delay) {
    if (!save.sound || !this.ctx || !cfg) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
      osc.type = cfg.type || 'sine';
      osc.frequency.setValueAtTime(cfg.freq, t);
      if (cfg.to !== cfg.freq) osc.frequency.exponentialRampToValueAtTime(cfg.to, t + cfg.dur);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(cfg.gain, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + cfg.dur);
      osc.connect(gain).connect(this.ctx.destination);
      osc.start(t); osc.stop(t + cfg.dur + 0.02);
    } catch (e) { /* звук не обязателен */ }
  },
  play(name) {
    const s = CONFIG.sounds[name];
    if (Array.isArray(s)) s.forEach((f, i) => this.blip({ freq: f, to: f, dur: 0.16, gain: 0.07, type: 'sine' }, i * 0.1));
    else this.blip(s, 0);
  },
};
function vibrate(p) {
  if (!save.sound) return;
  try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* нет вибро */ }
}

/* =====================================================================
   Салют на победу: canvas, requestAnimationFrame, delta time, пул частиц
   ===================================================================== */
const FX = (() => {
  const cv = $('fx'), ctx = cv.getContext('2d');
  const COLORS = ['#2EE8FF', '#FF4FD8', '#3DFFA8', '#FFD35A', '#EEEBFF'];
  const parts = Array.from({ length: 140 }, () => ({ life: 0, x: 0, y: 0, vx: 0, vy: 0, rot: 0, vr: 0, s: 0, c: '' }));
  let W = 0, H = 0, running = false, last = 0;
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function step(t) {
    const dt = clamp((t - last) / 1000, 0, 0.05); last = t;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of parts) {
      if (p.life <= 0) continue;
      p.life -= dt;
      p.vy += H * 1.4 * dt;
      p.vx *= 1 - 0.8 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.life <= 0 || p.y > H + 20) { p.life = 0; continue; }
      alive++;
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    if (alive) requestAnimationFrame(step);
    else { running = false; ctx.clearRect(0, 0, W, H); }
  }
  return {
    burst() {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      resize();
      for (const p of parts) {
        p.life = 1.2 + Math.random() * 0.9;
        p.x = W / 2 + (Math.random() - 0.5) * W * 0.3;
        p.y = H * 0.38;
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.9, sp = H * (0.6 + Math.random() * 0.9);
        p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
        p.rot = Math.random() * 6.28; p.vr = (Math.random() - 0.5) * 14;
        p.s = 6 + Math.random() * 7;
        p.c = COLORS[(Math.random() * COLORS.length) | 0];
      }
      if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); }
    },
  };
})();

/* =====================================================================
   Состояние
   ===================================================================== */
const defaults = () => ({ level: 1, coins: CONFIG.startCoins, stars: 0, sound: true, lang: detectLang(), seenRules: false, run: null });
let save = defaults();
let state = 'boot';            // boot → menu → playing → won → playing | menu
let run = null;                // текущий уровень: пазл, расстановка, подсказки, ошибки
let P = null;                  // run.puzzle
let tileAt = [];               // для каждой плитки банка: -1 — в банке, иначе индекс клетки
let eqStates = [];             // 'incomplete' | 'ok' | 'bad' для каждого примера
let cellEls = [], tileEls = [];
let dragTile = -1;              // плитка в руке — в банке её не показываем
let sel = { tile: -1, cell: -1 };
let moveHistory = [];           // снимки расстановки для отмены хода, только в памяти
let typed = '', typedTimer = 0;  // набор числа с клавиатуры

function sanitize(d) {
  const out = defaults();
  if (!d || typeof d !== 'object') return out;
  const lv = Number(d.level);
  out.level = Number.isInteger(lv) && lv >= 1 && lv < 100000 ? lv : 1;
  const coins = Number(d.coins);
  out.coins = Number.isFinite(coins) && coins >= 0 ? Math.floor(coins) : CONFIG.startCoins;
  const st = Number(d.stars);
  out.stars = Number.isFinite(st) && st >= 0 ? Math.floor(st) : 0;
  out.sound = d.sound !== false;
  out.lang = I18N[d.lang] ? d.lang : detectLang();
  out.seenRules = d.seenRules === true;
  out.run = validRun(d.run, out.level) ? d.run : null;
  return out;
}
function validRun(rn, level) {
  try {
    if (!rn || typeof rn !== 'object' || rn.level !== level) return false;
    const pz = rn.puzzle;
    if (!pz || pz.gen !== CONFIG.genVersion || !Array.isArray(pz.cells) || !Array.isArray(pz.eqs) || !Array.isArray(pz.bank)) return false;
    if (!Number.isInteger(pz.rows) || !Number.isInteger(pz.cols)) return false;
    const n = pz.cells.length;
    if (!n || pz.cells.some((c) => !c || !Number.isInteger(c.x) || !Number.isInteger(c.y) || !['n', 'o', 'e'].includes(c.t))) return false;
    if (pz.eqs.some((e) => !Array.isArray(e) || e.some((i) => !Number.isInteger(i) || i < 0 || i >= n))) return false;
    if (pz.bank.some((v) => !Number.isInteger(v))) return false;
    if (!Array.isArray(rn.board) || rn.board.length !== n) return false;
    const used = new Set();
    for (let i = 0; i < n; i++) {
      const t = rn.board[i];
      if (t === -1) continue;
      if (!Number.isInteger(t) || t < 0 || t >= pz.bank.length || used.has(t) || !pz.cells[i].b) return false;
      used.add(t);
    }
    if (!Array.isArray(rn.locked) || rn.locked.some((i) => !Number.isInteger(i) || i < 0 || i >= n || rn.board[i] < 0)) return false;
    rn.hints = Math.max(0, Number(rn.hints) || 0);
    rn.mistakes = Math.max(0, Number(rn.mistakes) || 0);
    rn.wasFull = rn.wasFull === true;
    rn.time = Number.isFinite(Number(rn.time)) && Number(rn.time) >= 0 ? Math.min(Number(rn.time), 864e5) : 0;
    return true;
  } catch (e) { return false; }
}

let saveTimer = 0;
function persist(now) {
  // секундомер не останавливаем, но в сейв пишем актуальное время
  if (run && clockRunning()) { run.time = Math.round(elapsedMs()); clockFrom = performance.now(); }
  clearTimeout(saveTimer);
  if (now) store.set(CONFIG.saveKey, save);
  else saveTimer = setTimeout(() => store.set(CONFIG.saveKey, save), 250);
}

/* Аппаратная кнопка «назад» на Android: из игры она должна уводить в меню,
   а не закрывать мини-апп. Держим в истории одну запись на игровой экран. */
let navLock = false;
function pushGameState() {
  try { if (!history.state || history.state.s !== 'game') history.pushState({ s: 'game' }, ''); } catch (e) { /* история недоступна */ }
}
window.addEventListener('popstate', () => {

/* Выход из уровня в меню — явный уход. Сворачивание игры посреди уровня —
   пауза: человек мог отвлечься и вернуться. Оба события шлются не чаще
   одного раза за попытку, чтобы переключения приложений не раздували счёт. */
let abandonSent = null, pauseSent = null;
function cellsLeft() { return P.blanks.filter((ci) => run.board[ci] < 0).length; }
function reportAbandon() {

    navLock = true;

    setTimeout(() => { navLock = false; }, 0);

  hideOverlay('winOv');
  clearSel();
  state = 'menu';
  persist(true);

function showOverlay(id) {

  $(id).classList.add('show');

function hideOverlay(id) { $(id).classList.remove('show'); }
